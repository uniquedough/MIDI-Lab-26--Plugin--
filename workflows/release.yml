name: GitHub release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m unittest discover -s engine/tests -p 'test_v*.py' -v
      - run: python scripts/build_release.py
      - name: Check tag matches manifest
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("plugin.json"))["version"])')
          test "$GITHUB_REF_NAME" = "v$VERSION"
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("plugin.json"))["version"])')
          gh release create "$GITHUB_REF_NAME" "dist/midi-lab-plugin-v${VERSION}.zip" \
            --title "MIDI Lab Plugin v${VERSION}" --notes-file RELEASE_NOTES.md --verify-tag
